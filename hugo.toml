baseURL = 'http://fahimimam.pro.bd/'
languageCode = 'en-us'
title = 'Fahim Imam - Software Developer'
theme = 'PaperMod'

enableEmoji = true

# URL structure settings
disableKinds = []
canonifyURLs = false
relativeURLs = false

[pagination]
pagerSize = 10

[permalinks]
posts = "/:filename/"
blog = "/blog/:filename/"
projects = "/projects/:filename/"

[params]
defaultTheme = "dark"
disableThemeToggle = true
homeInfoParams = false

[[params.socialIcons]]
name = "github"
url = "https://github.com/fahimimam"

[[params.socialIcons]]
name = "linkedin"
url = "https://linkedin.com/in/yourprofile"

[[params.socialIcons]]
name = "email"
url = "mailto:your@email.com"

ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true

[menu]
[[menu.main]]
identifier = "projects"
name = "Projects"
url = "/projects/"
weight = 10

[[menu.main]]
identifier = "blog"
name = "Blog"
url = "/blog/"
weight = 20

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 30

[taxonomies]
tag = "tags"
category = "categories"

[outputs]
home = ["HTML", "RSS", "JSON"]
baseURL = 'http://fahimimam.pro.bd/'
languageCode = 'en-us'
title = 'Fahim Imam - Software Developer'
theme = 'PaperMod'

enableEmoji = true

# URL structure settings
disableKinds = []
canonifyURLs = false
relativeURLs = false

[pagination]
pagerSize = 10

[permalinks]
posts = "/:contentbasename/"
blog = "/blog/:contentbasename/"
projects = "/projects/:contentbasename/"

[params]
defaultTheme = "dark"
disableThemeToggle = true
homeInfoParams = false
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true

[params.assets]
favicon = "/favicon.svg"

[[params.socialIcons]]
name = "github"
url = "https://github.com/fahimimam"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/kazi-fahim-imam-0027081a1/"

[[params.socialIcons]]
name = "email"
url = "mailto:fahimimam026@gmail.com"

[menu]
[[menu.main]]
identifier = "projects"
name = "Projects"
url = "/projects/"
weight = 10

[[menu.main]]
identifier = "blog"
name = "Blog"
url = "/blog/"
weight = 20

[[menu.main]]
identifier = "cv"
name = "CV"
url = "/cv/"
weight = 30

[[menu.main]]
identifier = "about"
